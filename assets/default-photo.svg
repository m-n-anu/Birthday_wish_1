<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="45%" stop-color="#fdcb6e"/>
      <stop offset="80%" stop-color="#e17055"/>
      <stop offset="100%" stop-color="#d63031"/>
    </radialGradient>
    <linearGradient id="goldRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff275"/>
      <stop offset="50%" stop-color="#ff8c42"/>
      <stop offset="100%" stop-color="#ff3c00"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#bgGrad)"/>

  <!-- Celebratory Confetti & Stars in Background -->
  <circle cx="120" cy="140" r="14" fill="#ffffff" opacity="0.7"/>
  <circle cx="480" cy="180" r="10" fill="#ffffff" opacity="0.6"/>
  <circle cx="160" cy="460" r="12" fill="#fff" opacity="0.5"/>
  <circle cx="450" cy="420" r="16" fill="#fff" opacity="0.6"/>

  <polygon points="300,50 310,75 335,80 315,98 322,122 300,108 278,122 285,98 265,80 290,75" fill="#fff3cd" opacity="0.85"/>
  <polygon points="100,280 108,298 128,302 112,316 117,335 100,324 83,335 88,316 72,302 92,298" fill="#ffeaa7" opacity="0.75"/>
  <polygon points="500,300 508,318 528,322 512,336 517,355 500,344 483,355 488,336 472,322 492,318" fill="#ffeaa7" opacity="0.75"/>

  <!-- Warm Celebratory Center Silhouette / Cake & Sparkles -->
  <g transform="translate(300, 310)">
    <!-- Cake Base Stand -->
    <ellipse cx="0" cy="110" rx="140" ry="24" fill="#2d3436" opacity="0.35"/>
    <path d="M-120,100 L120,100 L110,30 L-110,30 Z" fill="#ffffff" rx="10"/>
    <rect x="-110" y="30" width="220" height="15" fill="#ff7675"/>
    
    <!-- Second Tier -->
    <path d="M-80,30 L80,30 L72,-30 L-72,-30 Z" fill="#fff5f5"/>
    <rect x="-72" y="-30" width="144" height="12" fill="#fab1a0"/>

    <!-- Frosting Drips -->
    <path d="M-110,45 Q-95,65 -80,45 Q-65,65 -50,45 Q-35,65 -20,45 Q-5,65 10,45 Q25,65 40,45 Q55,65 70,45 Q85,65 100,45 L110,45 L110,30 L-110,30 Z" fill="#ff7675"/>
    <path d="M-72,-18 Q-58,-2 -44,-18 Q-30,-2 -16,-18 Q-2,-2 12,-18 Q26,-2 40,-18 Q54,-2 68,-18 L72,-18 L72,-30 L-72,-30 Z" fill="#fab1a0"/>

    <!-- Candle & Glowing Flame -->
    <rect x="-6" y="-75" width="12" height="45" fill="#fdcb6e" rx="4"/>
    <rect x="-6" y="-70" width="12" height="6" fill="#e17055"/>
    <rect x="-6" y="-55" width="12" height="6" fill="#e17055"/>
    
    <!-- Flame with Glow -->
    <path d="M0,-115 Q14,-95 0,-78 Q-14,-95 0,-115 Z" fill="#ff7675" filter="url(#glow)"/>
    <path d="M0,-110 Q9,-95 0,-82 Q-9,-95 0,-110 Z" fill="#ffeaa7"/>
  </g>

  <!-- Big Celebratory Typography -->
  <text x="300" y="475" text-anchor="middle" font-family="'Outfit', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="3" filter="url(#glow)">HAPPY BIRTHDAY</text>
  <text x="300" y="525" text-anchor="middle" font-family="'Caveat', cursive" font-weight="700" font-size="32" fill="#ffeaa7">Add Your Favorite Photo Here</text>
</svg>
